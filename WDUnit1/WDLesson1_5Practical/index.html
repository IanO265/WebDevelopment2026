<html>
  <head>
    <title>Exploring Containers</title>
    <link href="style.css" rel="stylesheet" type="text/css" />
  </head>
  <body>
    <!-- Challenge 1 & 2: Containers and elements -->

    <!-- Container 1: Header Section -->
    <div class="container">
      <h1>Exploring Containers</h1>
      <p>Welcome to our lesson on grouping elements using HTML containers.</p>
    </div>

    <!-- Container 2: Information Section -->
    <div class="container">
      <h2>About This Page</h2>
      <p>Containers help us bundle related content together<br>
         to style and structure web pages efficiently.</p>
    </div>

    <!-- Container 3: Image Section -->
    <div class="container">
      <h2>Gallery</h2>
      <img src="images/face.jpg"uniform-img" height="100">
      <img src="images/sign.jpg"uniform-img" height="100">
      <img src="images/sun.jpg"uniform-img" height="100">
    </div>

  </body>
